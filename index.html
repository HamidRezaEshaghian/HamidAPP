<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hamid APP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hamid APP – English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#fff;--soft:#f7f7f7;--ink:#3c3c3c;--mute:#777;--line:#e5e5e5;--accent:#58cc02;--accent-d:#58a700;--accent-ink:#163300;--teal:#3d8c00;--blue:#1cb0f6;--blue-d:#1899d6;--gold:#ffc800;--gold-d:#e5a800;--red:#ff4b4b;--plum:#ce82ff;--plum-d:#a560e8;--mark:#fff4c2;--nav:#fff;--nav-ink:#3c3c3c;--nav-mute:#777;--sel-bg:#ddf4ff;--sel-bd:#84d8ff;--sel-ink:#0b6fa4;--hov:#f7f7f7;--en:'Nunito',system-ui,sans-serif;--fa:'Vazirmatn',Tahoma,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131f24;--panel:#1f2c33;--soft:#16242a;--ink:#f1f7fb;--mute:#93a6b0;--line:#37464f;--teal:#7ddb2e;--blue:#49c0f8;--blue-d:#1cb0f6;--red:#ff7878;--mark:#3d3714;--nav:#131f24;--nav-ink:#f1f7fb;--nav-mute:#93a6b0;--sel-bg:rgba(28,176,246,.16);--sel-bd:#1cb0f6;--sel-ink:#7fd4fb;--hov:rgba(255,255,255,.05)}}
:root[data-theme=dark]{--bg:#131f24;--panel:#1f2c33;--soft:#16242a;--ink:#f1f7fb;--mute:#93a6b0;--line:#37464f;--teal:#7ddb2e;--blue:#49c0f8;--blue-d:#1cb0f6;--red:#ff7878;--mark:#3d3714;--nav:#131f24;--nav-ink:#f1f7fb;--nav-mute:#93a6b0;--sel-bg:rgba(28,176,246,.16);--sel-bd:#1cb0f6;--sel-ink:#7fd4fb;--hov:rgba(255,255,255,.05)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.65 var(--fa)}
.app{display:grid;grid-template-columns:310px 1fr;min-height:100vh}
nav{border-right:2px solid var(--line);background:var(--nav);color:var(--nav-ink);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font:900 30px/1.1 var(--en);margin:2px 6px 18px;color:var(--accent);letter-spacing:-.01em}
nav h1 small{display:block;margin-top:6px;font:700 13px var(--fa);color:var(--nav-mute);letter-spacing:0}
input[type=search]{width:100%;padding:11px 16px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font:inherit;font-size:15px;font-weight:700}
input[type=search]::placeholder{color:var(--nav-mute)}
input[type=search]:focus{border-color:var(--blue);outline:0}
#tree{margin-top:14px}
details{margin-top:4px}
summary{cursor:pointer;padding:8px 8px;font-weight:800;border-radius:12px}
nav summary:hover{background:var(--hov)}
nav>#tree>details>summary{font:900 17px var(--en);color:var(--ink)}
details details{margin-left:8px}
details details summary{font-weight:700;font-size:15px;color:var(--nav-mute)}
.les{display:block;width:calc(100% - 14px);text-align:left;margin:2px 0 2px 14px;padding:7px 12px;border:2px solid transparent;border-radius:14px;background:none;color:var(--nav-ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.les:hover{background:var(--hov)}
.les.on{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--sel-ink);font-weight:800}
.les.done::after{content:" ✓";color:var(--accent);font-weight:900}
main{min-width:0;padding:30px clamp(18px,4vw,56px) 60px;max-width:900px;width:100%}
body.dockon main{padding-bottom:150px}
.crumb{color:var(--blue-d);font-size:14px;font-weight:800}
h2{margin:4px 0 20px;font:900 clamp(26px,4vw,38px)/1.2 var(--en);letter-spacing:-.01em}
h3{font:800 21px var(--en);margin:28px 0 10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.spacer{flex:1}
.btn,.tab{font:inherit;cursor:pointer;color:var(--ink)}
.btn{border:2px solid var(--line);background:var(--panel);padding:8px 18px;border-radius:16px;font-size:15px;font-weight:800;color:var(--blue-d);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--hov)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
.btn.main:hover{background:#61d607}
.btn.main:active{box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
label.btn{display:inline-block}
.seg{display:inline-flex;padding:3px;border:2px solid var(--line);border-radius:16px;background:var(--panel)}
.seg button{border:2px solid transparent;background:none;color:var(--mute);padding:5px 14px;border-radius:12px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--sel-bg);border-color:var(--sel-bd);color:var(--sel-ink)}
.skills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:2px solid var(--line);background:var(--panel);padding:8px 16px;font-size:15.5px;font-weight:800;color:var(--mute);border-radius:16px;box-shadow:0 3px 0 var(--line)}
.tab:hover{background:var(--hov)}
.tab:active{transform:translateY(3px);box-shadow:none}
.tab.on{background:var(--accent);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-d);color:var(--accent-ink)}
.tab[data-k=tips].on{background:var(--plum);border-color:var(--plum);box-shadow:0 3px 0 var(--plum-d);color:#2e0a52}
.pair{background:none;border:0;border-bottom:2px solid var(--line);padding:14px 4px;margin:0}
.pair.reveal{cursor:pointer}
.pair.reveal:hover{background:var(--hov)}
.fa{font-family:var(--fa);direction:rtl;text-align:right;font-size:18px}
.en{font-family:var(--en);font-weight:700;font-size:20px;line-height:1.45;direction:ltr}
.reveal .tgt{display:none;margin-top:6px;color:var(--teal);font-size:17px}
.reveal.open .tgt{display:block}
.tgt.fa{font-family:var(--fa);direction:rtl;text-align:right}
.tr{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.tr b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:900 15px var(--en)}
.tr span{background:var(--panel);border:2px solid var(--line);border-radius:6px 18px 18px 18px;padding:8px 14px;max-width:88%}
.tr.B{flex-direction:row-reverse}.tr.B b{background:var(--blue);color:#06324a}.tr.B span{border-radius:18px 6px 18px 18px;background:var(--sel-bg);border-color:var(--sel-bd)}
.empty{color:var(--mute);padding:48px 0;font-size:17px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:24px;margin-bottom:16px;box-shadow:0 4px 0 var(--line)}
.prog{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.38)}
.prompt{font:800 clamp(22px,3.4vw,30px)/1.4 var(--en);margin:6px 0 14px}
.prompt.fa{font-family:var(--fa);font-weight:800;direction:rtl;text-align:right;font-size:clamp(22px,3.2vw,28px)}
textarea{width:100%;min-height:96px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);font:inherit;font-size:18px;font-weight:700;resize:vertical}
textarea:focus{border-color:var(--blue);outline:0}
textarea.rtl{direction:rtl;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.res{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.tok{display:inline-block;margin:3px;padding:1px 9px;border-radius:8px;font-weight:700}
.tok.ok{background:rgba(88,204,2,.22)}
.tok.bad{background:rgba(255,75,75,.2);text-decoration:line-through}
.tok.miss{background:var(--mark);box-shadow:inset 0 -3px 0 var(--gold)}
.lbl{color:var(--mute);font-size:14px;margin:10px 0 2px;font-weight:700}
.score{font:900 22px var(--en);margin:0;color:var(--teal)}
.ai{white-space:pre-wrap;font-family:var(--fa);direction:rtl;text-align:right;line-height:1.95;margin-top:12px;background:var(--soft);border-radius:16px;padding:0 14px}
.ai:not(:empty){padding:12px 14px}
.cnt{color:var(--mute);font-size:14px}
.voice{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:10px}
.voice summary{padding:4px 0;font-weight:800}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.vname{flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.menu{display:none}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}nav{position:fixed;inset:0 18% 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;height:100%}nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}.menu{display:inline-block}main{padding-top:18px}.card{padding:18px}.tab{padding:9px 10px;font-size:14.5px;white-space:nowrap}.skills{flex-wrap:nowrap;overflow-x:auto}.bar{gap:8px}}
.tbl{border:2px solid var(--line);border-radius:22px;overflow:hidden;background:var(--panel);box-shadow:0 4px 0 var(--line)}
.th,.trow{display:grid;grid-template-columns:48px 1fr 1fr;column-gap:16px;align-items:baseline;padding:12px 18px}
.th{background:var(--soft);color:var(--mute);font-size:13px;font-weight:800;border-bottom:2px solid var(--line)}
.th .fa{font-size:13px}
.trow{border-top:2px solid var(--line);transition:background .15s}
.trow:first-of-type{border-top:0}
.trow:hover{background:var(--sel-bg)}
.trow.reveal{cursor:pointer}
.trow .n{color:var(--blue-d);font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.trow .c.en{font-size:18.5px}
.trow .c.fa{font-size:17px}
.trow .hid{filter:blur(7px);user-select:none;transition:filter .2s}
.trow.open .hid,.tbl.all .hid{filter:none}
@media (max-width:600px){.th,.trow{grid-template-columns:30px 1fr;padding:12px 14px}.th .fa{display:none}.trow .c.fa{grid-column:2;margin-top:2px}.th span:nth-child(3){display:none}}
.rv{margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.rv-fix{margin:2px 0 12px;background:rgba(88,204,2,.16);border-radius:14px;padding:10px 14px}
.rv-err{border-left:5px solid var(--gold);background:var(--soft);border-radius:12px;padding:10px 14px;margin:8px 0}
.rv-err s{color:var(--red);text-decoration-thickness:2px}.rv-err b{color:var(--teal)}
.rv-err .why{margin-top:4px;font-size:15.5px;color:var(--mute);line-height:1.9}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 10px;border-radius:99px;background:var(--sel-bg);color:var(--sel-ink);border:2px solid var(--sel-bd);margin-right:6px}
.ttog{font-family:var(--fa);font-weight:700;font-size:13px;padding:3px 12px;margin-left:14px;vertical-align:middle;color:var(--mute)}
.sel{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;max-width:100%}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:12px 16px;font:inherit;font-size:17px;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--blue)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.on{border-color:var(--blue);background:var(--sel-bg);box-shadow:0 4px 0 var(--blue-d)}
.opt.right{border-color:var(--accent);background:rgba(88,204,2,.18);box-shadow:0 4px 0 var(--accent-d)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.16);box-shadow:0 4px 0 var(--red)}
.big{font:900 68px/1 var(--en);color:var(--accent)}.big small{font-size:22px;color:var(--mute)}
.sb{display:grid;grid-template-columns:96px 1fr 38px;gap:12px;align-items:center;margin:8px 0}
.sb .t{height:14px;background:var(--line);border-radius:99px;overflow:hidden}.sb .t i{display:block;height:100%;background:var(--accent);border-radius:99px}.sb b{text-align:right}
.hist{display:flex;gap:8px;align-items:flex-end;height:96px;margin:6px 0 4px}
.hb{flex:1;max-width:46px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.hb i{display:block;width:100%;background:var(--blue);border-radius:8px 8px 0 0}.hb:last-child i{background:var(--gold)}
.hb span{font-size:12px;color:var(--mute)}
.les .sc{float:right;font-size:12px;font-weight:900;color:var(--gold-d);margin-top:2px}
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:7px 14px;font:inherit;font-family:var(--en);font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip:hover{border-color:var(--blue)}.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-d)}
.tip{background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--plum);border-radius:22px;padding:6px 20px 16px;margin:16px 0;box-shadow:0 4px 0 var(--line)}
.tip h4{font:900 20px var(--en);margin:12px 0 4px}
.tex{margin:8px 0;padding:8px 14px;border-radius:14px;background:var(--soft)}
.tsum{background:var(--sel-bg);border:2px solid var(--sel-bd);border-radius:18px;padding:12px 16px}
.tmem{background:var(--mark);border-radius:14px;padding:8px 14px}
#dock{position:fixed;left:310px;right:0;bottom:0;z-index:4;display:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
body.dockon #dock{display:block}
.dk{max-width:860px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk .nm{flex:1 1 100%;font-size:13px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk .btn{padding:6px 12px}
.dk .t{font:800 13px var(--en);color:var(--mute);min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
.dk input[type=range]{flex:1 1 140px;min-width:100px;height:28px;accent-color:var(--accent)}
@media (max-width:760px){#dock{left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 85% 8%,rgba(28,176,246,.14),transparent 70%),radial-gradient(520px 520px at 10% 90%,rgba(88,204,2,.14),transparent 70%),radial-gradient(300px 300px at 60% 55%,rgba(255,200,0,.10),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-30px,24px) scale(1.06)}}
@keyframes pop{0%{transform:scale(.94) translateY(12px);opacity:0}70%{transform:scale(1.02)}100%{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes fade{from{opacity:0}}
@keyframes flame{50%{transform:scale(1.18) rotate(6deg)}}
nav{background:linear-gradient(180deg,var(--panel),var(--soft));border-right:0;box-shadow:6px 0 30px rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 0 12px;border-radius:24px;background:linear-gradient(135deg,#58cc02,#1fb08a);color:#fff;box-shadow:0 5px 0 #46a302}
.brand .owl{font-size:36px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.brand b{display:block;font:900 24px/1.1 var(--en)}.brand small{display:block;font:700 12px var(--fa);opacity:.92}
.brand>div{flex:1;min-width:0}
.gear{position:relative;flex:none;width:44px;height:44px;border-radius:16px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;transition:transform .35s,background .2s}
.gear:hover{transform:rotate(90deg);background:rgba(255,255,255,.34)}
.gear i{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:#ff4b4b}
.gear.on i{background:#ffc800}
.stats{display:flex;gap:8px;margin:0 0 12px}
.stats span{flex:1;text-align:center;padding:7px 8px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font:900 15px var(--en);box-shadow:0 3px 0 var(--line)}
#stk{color:#ff9600}#sxp{color:#e5a800}
.stats .hot{animation:flame .5s}
summary{list-style:none;transition:background .15s,transform .15s}summary::-webkit-details-marker{display:none}
nav>#tree>details>summary{padding:10px 12px;border-radius:16px;background:var(--soft);border:2px solid var(--line);margin-top:8px}
nav summary:hover{transform:translateX(3px)}
details[open]>summary{color:var(--accent-d)}
.les{border-radius:16px;transition:background .15s,transform .15s}
.les:hover{transform:translateX(4px)}
.les.on{box-shadow:0 3px 0 var(--sel-bd)}
.skills{gap:10px}
.tab{--tc:#1cb0f6;--td:#1899d6;border-radius:18px;padding:9px 16px;transition:transform .15s,box-shadow .15s,background .15s}
.tab[data-k=listening]{--tc:#ff9600;--td:#cc7a00}.tab[data-k=writing]{--tc:#58cc02;--td:#46a302}.tab[data-k=speaking]{--tc:#ff4b4b;--td:#d33131}.tab[data-k=free]{--tc:#2b70c9;--td:#1d5399}.tab[data-k=exam]{--tc:#ffc800;--td:#cc9f00}.tab[data-k=tips]{--tc:#ce82ff;--td:#a560e8}
.tab:hover{transform:translateY(-3px) rotate(-1deg);border-color:var(--tc)}
.tab.on,.tab[data-k=tips].on{background:var(--tc);border-color:var(--tc);box-shadow:0 4px 0 var(--td);color:#fff;transform:translateY(-1px)}
.tab[data-k=exam].on{color:#3a2c00}
.btn,.opt,.chip{transition:transform .12s,box-shadow .12s,background .15s,border-color .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.opt:hover{transform:translateY(-2px)}
.opt.right{animation:pop .35s}.opt.wrong{animation:shake .4s}
#body>.card,#body>.tbl,#body>.tip,#tout>.tip,#tout>.card,.res{animation:pop .4s both}
.card.shake{animation:shake .45s}
.card{border-radius:26px}
.prog{height:18px}.prog i{background:linear-gradient(90deg,#58cc02,#8be31c);transition:width .6s cubic-bezier(.3,1.5,.5,1)}
.big{animation:pop .6s both}
.welcome{text-align:center;padding:56px 12px}.welcome .owl{font-size:84px;animation:bob 2.6s ease-in-out infinite;display:inline-block}
.welcome h2{margin:10px 0 6px}.welcome p{color:var(--mute);font-size:17px;margin:0}
.aiwarn{margin:10px 0;padding:12px 14px;border-radius:18px;background:var(--mark);border:2px solid var(--gold);font-weight:800}
.aiwarn .btn{margin:8px 0 0}
.cf{position:fixed;inset:0;z-index:99;pointer-events:none}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function others(p,it,n,key){

  for(let k=0;k<60&&out.length<n;k++){const ls=lessonItems(W[Math.random()*W.length|0]);if(!ls.length)continue;ENW(ls[Math.random()*ls.length|0]).forEach(w=>{const c=tokW(w);if(out.length<n&&c.length>=3&&c.toLowerCase()!==a&&!out.includes(c))out.push(c)})}

function mutate(en){

function makeQ(t,k,p,it){
  const q={k,t,p,sel:null,plays:t==='s_repeat'?1:2};
  if(t==='r_mc_fa'||t==='l_mc_fa'){q.ref=p.fa;q.opts=shuf([p.fa,...others(p,it,3,'fa')]);q.rp=t==='r_mc_fa'?p.en:'(audio)'}
  else if(t==='r_mc_en'){q.ref=p.en;q.opts=shuf([p.en,...others(p,it,3,'en')]);q.rp=p.fa}
  else if(t==='l_mc_en'){q.ref=p.en;q.opts=shuf([...new Set([p.en,mutate(p.en),...others(p,it,2,'en')])]);q.rp='(audio)'}

  else if(t==='l_dict'||t==='s_repeat'){q.ref=p.en;q.rp='(audio)'}

}
function startExam(){

  if(!it.length){ex=null;$('body').innerHTML='<p class="empty">This lesson has no sentences to build an exam from.</p>';return}
  let S={};try{S=JSON.parse(localStorage.getItem('exseen_v1')||'{}')}catch(e){}
  let seen=new Set(S[cur.path]||[]);
  const slots=[];EXS.forEach(k=>{const n=2+(Math.random()<.5?1:0);shuf(SKT[k]).slice(0,n).forEach(t=>slots.push({k,t}))});
  let fresh=shuf(it.filter(p=>!seen.has(p.en)));
  if(fresh.length<slots.length){seen=new Set();fresh=shuf(it)}
  const used=[],qs=shuf(slots).map(sl=>{
    let i=fresh.findIndex(p=>okFor(sl.t,p)),p;
    if(i>=0){p=fresh[i];fresh.splice(i,1)}else p=shuf(it).find(x=>okFor(sl.t,x))||it[0];
    used.push(p.en);return makeQ(sl.t,sl.k,p,it)});
  try{S[cur.path]=[...seen,...used].slice(-400);localStorage.setItem('exseen_v1',JSON.stringify(S))}catch(e){}
  ex={qs,i:0,ans:[],saved:false};examView();
}

  const hist=exams[cur.path],d=prev?o-prev.o:0;
  b.innerHTML=`<div class="card"><p class="lbl" style="margin-top:0">Your score · نمرهٔ شما</p><div class="big">${o}<small> / 100</small></div><p class="score">${verdict(o)}</p><p style="direction:ltr;text-align:left;margin:4px 0 14px">${prev?(d>0?'▲ +'+d:d<0?'▼ '+d:'＝ 0')+` compared with your last attempt (${prev.o})`:'First attempt: this is your starting point.'}</p>${EXS.map(k=>`<div class="sb"><span>${EXL[k].split(' · ')[0]}</span><div class="t"><i style="width:${sk[k]}%"></i></div><b>${sk[k]}</b></div>`).join('')}${histChart(hist)}
  <details class="voice" style="margin-top:14px"><summary>Review your answers · مرور پاسخ‌ها</summary>${ex.ans.map((x,i)=>{const df=x.typed&&x.a?diff(x.a,x.ref):null,fa=s=>isFa(s)?'fa':'en';return`<div class="rv-err"><div class="cnt">${i+1}. ${EXL[x.k].split(' · ')[0]} · ${TL[x.t]} · ${x.sc}/100</div><div class="${fa(x.rp)}" style="margin:4px 0">${esc(x.rp)}</div><div class="${fa(x.a||'a')}">${df?toks(df.ans):esc(x.a||'—')}</div><div class="${fa(x.ref)}" style="color:var(--teal)">✓ ${esc(x.ref)}</div>${isFa(x.ref)?'':`<div class="fa lbl">${esc(x.p.fa)}</div>`}</div>`}).join('')}</details>
  <div class="row"><button class="btn" id="exfb">Examiner's feedback · نظر ممتحن</button><span class="spacer"></span><button class="btn main" id="exagain">Retake · امتحان دوباره</button></div><div class="ai" id="exai"></div></div>`;
  $('exagain').onclick=startExam;
  $('exfb').onclick=async()=>{const el=$('exai');el.textContent='…';try{const S=window.claude&&await claude.use('sample');if(!S){el.textContent='هوش مصنوعی وصل نیست؛ از ⚙️ تنظیمات وصلش کن.';return}
    const lines=ex.ans.map(x=>`[${x.k}/${TL[x.t]}] expected: "${x.ref}" | learner: "${x.a||'(no answer)'}" | ${x.sc}/100`).join('\n');
    await S(`You are an IELTS-style examiner for a Persian-speaking learner of English. Lesson exam results (overall ${o}/100; reading ${sk.reading}, listening ${sk.listening}, writing ${sk.writing}, speaking ${sk.speaking}):\n${lines}\nWrite brief feedback in Persian (about 120 words): their level, strengths, the 3 most important mistake patterns with the correct English form, and one study tip. Note that scoring is by word match, so a correct alternative wording may have been scored low.`,{modelTier:'quick',cache:false,onText:u=>{el.textContent=u.text}})}catch(e){el.textContent=aiMsg(e)}};
}
const gv=()=>{try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){voices=[]}};
const vscore=v=>(/natural|neural|online/i.test(v.name)?5:0)+(/google|premium|enhanced|siri/i.test(v.name)?2:0)+(/^en[-_]GB/i.test(v.lang)?4:/^en[-_]AU/i.test(v.lang)?2:0);
const isMale=v=>/(^|[^a-z])male/i.test(v.name)||/\b(ryan|thomas|george|daniel|oliver|james|arthur|rishi|alfie|william|david|mark|guy|alex|fred|gordon|aaron|liam|hamish|brian|christopher|eric|roger|steffan|jason|tony|andrew|brandon|ollie|reed|rocko|eddy|ravi|henry|noah|connor|elliot|jacob|rhys|sam)\b/i.test(v.name);
function pickVoice(text){
  if(!voices.length)gv();if(!voices.length)return null;
  const named=voices.find(v=>v.name===vpref);if(named)return named;
  const uk=voices.filter(v=>/^en[-_](GB|AU|IE)/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a));
  const pool=uk.length?uk:voices.slice().sort((a,b)=>vscore(b)-vscore(a));
  if(vpref==='mix'){const top=pool.slice(0,4),m=pool.find(isMale);if(m&&!top.includes(m))top[3]=m;let h=0;for(const c of text)h=(h*31+c.charCodeAt(0))>>>0;return top[h%top.length]}
  const byScore=a=>a.slice().sort((x,y)=>vscore(y)-vscore(x));
  return uk.filter(isMale)[0]||byScore(voices.filter(isMale))[0]||pool[0];
}
function speak(text,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),v=pickVoice(text);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=slow?.65:.9;speechSynthesis.speak(u)}catch(e){}}
function fillVoiceSel(cb,retry){
  const s=$('vsel');if(!s)return;gv();
  s.innerHTML='<option value="auto">IELTS examiner · British male (auto)</option><option value="mix">IELTS mix · male &amp; female voices</option>'+voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})${isMale(v)?' · male':''}</option>`).join('');
  s.value=[...s.options].some(o=>o.value===vpref)?vpref:'auto';
  s.onchange=()=>{vpref=s.value;savePrefs();cb()};
  const note=$('vnote');if(note)note.textContent=voices.length&&!voices.some(isMale)?'No male English voice found on this device, so the best available voice is used. Edge offers male voices such as Ryan and Thomas (Natural). · در این دستگاه صدای آقا پیدا نشد.':'';
  if(!voices.length&&!retry)setTimeout(()=>fillVoiceSel(cb,true),700);
}
function exercise(){
  const it=Q,b=$('body');
  if(!it.length){b.innerHTML=`<p class="empty">${mistMode?'No mistakes saved yet. Wrong answers will be collected here.':'This lesson has no translated lines to practise.'}</p>`;return}
  if(idx>=it.length)idx=0;posSet(idx,it.length);
  const p=it[idx].p,e2f=skill!=='listening'&&it[idx].d==='en2fa',src=e2f?p.en:p.fa,ref=e2f?p.fa:p.en,refFa=e2f,
  mean=skill==='listening'?`<p class="lbl">Persian meaning (for reference) · معنی فارسی</p><p class="fa">${esc(p.fa)}</p>`:'';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let prompt="",tools="",hint="";
  if(skill==='listening'){prompt=`<p class="prompt" style="font-size:20px">Listen and type the English sentence you hear.</p><p class="lbl">جمله‌ای را که می‌شنوید به انگلیسی بنویسید. · Use Play or Slow to hear it again.</p>`;tools=`<button class="btn" id="play">▶ Play</button><button class="btn" id="slow">▶ Slow</button><select id="vsel" class="sel" aria-label="Voice"></select><span class="cnt" id="vnote" style="flex-basis:100%"></span>`}
  else if(skill==='writing'){prompt=`<p class="prompt ${e2f?'':'fa'}">${esc(src)}</p><p class="lbl">Translate into ${refFa?'Persian':'English'}.</p>`}
  else{prompt=`<p class="prompt ${e2f?'':'fa'}">${esc(src)}</p><p class="lbl">Say it in ${refFa?'Persian':'English'}, then check.</p>`;tools=SR?`<button class="btn" id="mic">🎤 Speak</button>`:`<span class="cnt">Speech recognition isn't available in this browser; type your answer instead.</span>`}
  b.innerHTML=`<div class="card"><div class="prog" aria-hidden="true"><i style="width:${(idx+1)/it.length*100}%"></i></div><div class="cnt">${idx+1} / ${it.length}</div>${prompt}<textarea id="ans" class="${refFa?'rtl':''}" placeholder="${skill==='speaking'?'Your spoken words appear here…':'Your answer'}"></textarea>
  <div class="row">${tools}<button class="btn main" id="chk">Check</button><button class="btn" id="show">Show answer</button><span class="spacer"></span><button class="btn" id="prev">‹ Prev</button><button class="btn" id="next">Next ›</button></div><div id="res"></div></div>`;
  if(skill==='listening'){fillVoiceSel(()=>speak(p.en));$('play').onclick=()=>speak(p.en);$('slow').onclick=()=>speak(p.en,true);setTimeout(()=>speak(p.en),150)}
  if(skill==='speaking'&&SR)$('mic').onclick=()=>{const r=new SR();r.lang=refFa?'fa-IR':'en-US';r.interimResults=false;$('mic').textContent='🎤 Listening…';r.onresult=e=>{$('ans').value=e.results[0][0].transcript;check()};r.onerror=e=>{$('res').innerHTML=`<p class="lbl">Microphone unavailable (${esc(e.error)}). Type your answer and press Check.</p>`};r.onend=()=>{$('mic').textContent='🎤 Speak'};try{r.start()}catch(e){}};
  $('prev').onclick=()=>{idx=(idx-1+it.length)%it.length;exercise()};$('next').onclick=()=>{idx=(idx+1)%it.length;exercise()};$('chk').onclick=check;
  $('show').onclick=()=>{const a=$('ans').value.trim();$('res').innerHTML=`<div class="res"><p class="lbl">Correct answer · پاسخ درست</p><p class="${refFa?'fa':'en'}"><b>${esc(ref)}</b></p>${mean}${a?`<p class="lbl">Your answer</p><p class="${refFa?'fa':'en'}">${esc(a)}</p>`:''}<div class="row"><button class="btn" id="hear">▶ Hear English</button></div></div>`;$('hear').onclick=()=>speak(p.en)};
  function check(){
    const a=$('ans').value;if(!a.trim()){$('res').innerHTML='<p class="lbl">Write or say something first.</p>';return}
    const d=diff(a,ref),pct=Math.round(d.score*100);
    fx(d.perfect);const key=p.en;mist=mist.filter(m=>m.en!==key);if(!d.perfect)mist.unshift({fa:p.fa,en:p.en});save();$('mist').textContent=`My mistakes (${mist.length})`;
    $('res').innerHTML=`<div class="res"><p class="score">${d.perfect?'Correct ✓':`Match ${pct}% — see the mistakes below`}</p>
    <p class="lbl">Your answer (red = wrong or extra)</p><div class="${refFa?'fa':'en'}">${toks(d.ans)}</div>
    <p class="lbl">Correct answer (yellow = what you missed)</p><div class="${refFa?'fa':'en'}">${toks(d.ref.length?d.ref:[['ok','']])}</div><p class="${refFa?'fa':'en'}" style="margin-top:8px"><b>${esc(ref)}</b></p>${mean}
    <div class="row"><button class="btn" id="hear">▶ Hear English</button><button class="btn" id="ask" style="display:none">Explain my mistakes (فارسی)</button></div><div class="ai" id="ai"></div><div id="rv"></div></div>`;
    $('hear').onclick=()=>speak(p.en);
    if(!refFa)runReview(a,skill==='speaking'?'speech':'',$('rv'),ref);
    if(refFa&&!d.perfect&&window.claude)claude.use("sample").then(S=>{if(!S)return;const ask=$('ask');if(!ask)return;ask.style.display='';ask.onclick=async()=>{ask.disabled=true;$('ai').textContent='…';
      try{await S(`You are a friendly English teacher for a Persian speaker. Exercise: ${skill==='listening'?'dictation (the student listened to an English sentence and typed it; check spelling, grammar and missing words)':e2f?'translate English to Persian':'translate Persian to English'}.\nPrompt: ${skill==='listening'?p.en:src}\nStudent answer: ${a}\nReference answer: ${ref}\nIn Persian, briefly list the student's mistakes (grammar, spelling, word choice, missing words) and why, then give the corrected sentence. Be encouraging and concise.`,{modelTier:'quick',cache:false,onText:u=>{$('ai').textContent=u.text}})}catch(e){$('ai').textContent=aiMsg(e)}ask.disabled=false}}).catch(()=>{});
  }
}
$('q').oninput=e=>buildTree(e.target.value);
$('dir').onclick=e=>{const d=e.target.dataset&&e.target.dataset.d;if(d){dir=d;savePrefs();buildQ();hdr();body()}};
$('ord').onclick=e=>{const o=e.target.dataset&&e.target.dataset.o;if(o){ord=o;savePrefs();buildQ();hdr();body()}};
$('mist').onclick=()=>{mistMode=true;if(skill==='reading')skill='writing';buildQ();$('nav').classList.remove('open');render()};
$('done').onclick=()=>{if(!cur)return;learned[cur.path]=!learned[cur.path];save();if(learned[cur.path]){fx(true,1);RS.max[cur.path]=100;saveRS()}render()};
$('menu').onclick=()=>$('nav').classList.toggle('open');
const UIS={tab:[[523,0],[659,.07]],les:[[587,0],[784,.07],[988,.14]],sum:[[440,0],[554,.05]],btn:[[494,0]],opt:[[392,0],[523,.06]],gear:[[330,0],[440,.07],[587,.14]],menu:[[392,0],[523,.06],[659,.12]]};
function uiSnd(k){if(LS('snd')==='0')return;(UIS[k]||[]).forEach(a=>tone(a[0],a[1],.12,.09));try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('button,summary,label.btn');if(!t||t.id==='chk'||t.id==='enext')return;const c=t.classList;uiSnd(t.id==='gear'?'gear':t.id==='menu'?'menu':c.contains('tab')?'tab':c.contains('les')?'les':t.tagName==='SUMMARY'?'sum':(c.contains('opt')||c.contains('chip'))?'opt':'btn')},true);
$('scrim').onclick=()=>{$('nav').classList.remove('open');uiSnd('sum')};
let sx=0;$('nav').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});$('nav').addEventListener('touchend',e=>{if(sx-e.changedTouches[0].clientX>60)$('nav').classList.remove('open')},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('nav').classList.remove('open')});
(function(){let f=null;DATA.forEach(lv=>lv.units.forEach(u=>u.lessons.forEach(l=>{if(l.path===RS.last)f=[lv,u,l]})));
 if(f){const[lv,u,l]=f;cur=l;l.unit=u;l.level=lv;skill=RS.sk[l.path]||skill;buildQ();render();setTimeout(()=>toast('▶ ادامه از: '+clean(l.name)),600)}else{buildTree();hdr()}})();
</script>
